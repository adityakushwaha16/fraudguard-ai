{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="container auth-wrap"><div class="auth-card reveal"><div class="fg-card p-4">
  <div class="text-center mb-4"><div class="brand justify-content-center mb-2"><span class="logo"><i class="bi bi-shield-check"></i></span></div>
  <h1 class="h3 fw-bold">Create account</h1><p class="muted mb-0">Start analyzing transactions</p></div>
  <form id="authForm" data-mode="register" novalidate>
    <div class="mb-3"><label class="form-label" for="full_name">Full name</label><input class="form-control" id="full_name" name="full_name" required autocomplete="name"></div>
    <div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" type="email" id="email" name="email" required autocomplete="email"></div>
    <div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" type="password" id="password" name="password" required minlength="8" autocomplete="new-password"><div class="form-text">At least 8 characters.</div></div>
    <div class="alert alert-danger py-2 d-none" id="formError" role="alert"></div>
    <button class="btn-fg w-100" type="submit">Register</button>
  </form>
  <p class="text-center mt-3 mb-0 muted">Already registered? <a href="{{ url_for('pages.login_page') }}">Log in</a></p>
</div></div></div>
{% endblock %}
