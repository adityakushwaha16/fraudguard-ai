{% extends "base.html" %}{% block title %}Profile{% endblock %}
{% block content %}
<div class="container py-4" style="max-width:640px"><div class="fg-card reveal"><h1 class="h4 fw-bold mb-3">Your profile</h1>
  <dl class="row mb-0" id="profileBox"><dt class="col-sm-4 muted">Name</dt><dd class="col-sm-8" id="p-name">...</dd>
  <dt class="col-sm-4 muted">Email</dt><dd class="col-sm-8" id="p-email">...</dd>
  <dt class="col-sm-4 muted">Member since</dt><dd class="col-sm-8" id="p-since">...</dd>
  <dt class="col-sm-4 muted">Transactions analyzed</dt><dd class="col-sm-8" id="p-count">...</dd></dl>
  <button class="btn-ghost mt-4" id="logoutBtn2"><i class="bi bi-box-arrow-right me-1"></i>Log out</button></div></div>
{% endblock %}
